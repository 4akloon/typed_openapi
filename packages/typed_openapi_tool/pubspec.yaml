name: typed_openapi_tool
description: >
  Repository tools of typed_openapi: the public-spec corpus and the escaping
  fuzz. Never published; the generator and the runtime never depend on it.
publish_to: none

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  args: ^2.7.0
  crypto: ^3.0.6
  path: ^1.9.1
  # The generator of this workspace, whatever its version (M11 raises it
  # with every change of output).
  typed_openapi: any
  # corpus.yaml and corpus.lock are read here, never by the generator.
  yaml: ^3.1.4

dev_dependencies:
  # The spans of the diagnostics the SARIF tests report.
  source_span: ^1.10.2
  test: ^1.24.0

resolution: workspace
