  The core of clients generated by typed_openapi: typed errors, Result,
  Patch for tri-state fields, JSON decoding with paths, parameter encoders,
  an SSE decoder and the ClientTransport interface a transport implements.
version: 0.2.0
homepage: https://github.com/4akloon/typed_openapi
repository: https://github.com/4akloon/typed_openapi
issue_tracker: https://github.com/4akloon/typed_openapi/issues
topics:
  - openapi
  - api-client
  - http
  - sse
  - json

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  meta: ^1.15.0

dev_dependencies:
  fake_async: ^1.3.1
  test: ^1.24.0

resolution: workspace
