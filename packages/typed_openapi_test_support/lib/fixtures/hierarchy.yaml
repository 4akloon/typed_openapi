openapi: 3.1.0
info: {title: Hierarchy, version: "1"}
paths:
  /pets:
    get:
      operationId: listPets
      tags: [pets]
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Zoo'}
components:
  schemas:
    Zoo:
      type: object
      properties:
        pets:
          type: array
          items: {$ref: '#/components/schemas/Pet'}
        shape: {$ref: '#/components/schemas/Shape'}
    Pet:
      type: object
      required: [name]
      properties:
        name: {type: string}
      discriminator:
        propertyName: petType
        mapping:
          dog: '#/components/schemas/Dog'
          cat: '#/components/schemas/Cat'
          kitty: '#/components/schemas/Cat'
    Cat:
      allOf:
        - $ref: '#/components/schemas/Pet'
        - type: object
          properties:
            lives: {type: integer}
    Dog:
      allOf:
        - $ref: '#/components/schemas/Pet'
        - type: object
          properties:
            weight: {type: integer}
      discriminator:
        propertyName: breed
        mapping:
          lab: '#/components/schemas/Lab'
          pup: '#/components/schemas/Lab'
    Lab:
      allOf:
        - $ref: '#/components/schemas/Dog'
        - type: object
          properties:
            color: {type: string}
    Circle:
      type: object
      properties:
        radius: {type: number}
    # The inline variant has no value that selects it (TOA450), so its
    # wrapper is never made by fromJson.
    Shape:
      oneOf:
        - $ref: '#/components/schemas/Circle'
        - type: object
          properties:
            side: {type: number}
      discriminator:
        propertyName: kind
        mapping: {circle: '#/components/schemas/Circle'}
