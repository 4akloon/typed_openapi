openapi: 3.1.0
info: {title: Event ranges, version: "1"}
paths:
  /ranged:
    get:
      operationId: ranged
      tags: [ranges]
      responses:
        "2XX":
          description: Events, whatever the success status is.
          content:
            text/event-stream: {schema: {type: string}}
  /both:
    get:
      operationId: both
      tags: [ranges]
      responses:
        "200":
          description: Events.
          content:
            text/event-stream: {schema: {type: string}}
        "2XX":
          description: Events of the other successes.
          content:
            text/event-stream: {schema: {type: string}}
  /submit:
    post:
      operationId: submit
      tags: [ranges]
      requestBody:
        required: true
        content:
          application/json: {schema: {type: object, properties: {n: {type: integer}}}}
      responses:
        "200":
          description: Events.
          content:
            text/event-stream: {schema: {type: string}}
