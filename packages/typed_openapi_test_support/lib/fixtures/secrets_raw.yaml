openapi: 3.1.0
info: {title: Raw secrets, version: "1"}
paths:
  /session:
    post:
      operationId: session
      requestBody:
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Session'}
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Tagged'}
components:
  schemas:
    PwLogin:
      type: object
      properties:
        user: {type: string}
        password: {type: string, format: password}
    MailLogin:
      type: object
      properties:
        mail: {type: string}
        token: {type: string, writeOnly: true}
    Plain:
      type: object
      properties:
        name: {type: string}
    # Two objects, no discriminator: the value stays raw JSON.
    Auth:
      oneOf:
        - {$ref: '#/components/schemas/PwLogin'}
        - {$ref: '#/components/schemas/MailLogin'}
    # The same without a secret anywhere.
    Harmless:
      oneOf:
        - {$ref: '#/components/schemas/Plain'}
        - type: object
          properties:
            other: {type: string}
    Session:
      type: object
      properties:
        name: {type: string}
        auth: {$ref: '#/components/schemas/Auth'}
        auths:
          type: array
          items: {$ref: '#/components/schemas/Auth'}
        byKey:
          type: object
          additionalProperties: {$ref: '#/components/schemas/Auth'}
        harmless: {$ref: '#/components/schemas/Harmless'}
        mixed: {$ref: '#/components/schemas/Mixed'}
        typed: {$ref: '#/components/schemas/PwLogin'}
        node: {$ref: '#/components/schemas/Node'}
        ring: {$ref: '#/components/schemas/Ring'}
      additionalProperties: {$ref: '#/components/schemas/Auth'}
    # A variant that holds raw JSON next to a plain one.
    Mixed:
      oneOf:
        - {$ref: '#/components/schemas/Auth'}
        - {type: string}
    Tagged:
      oneOf:
        - {$ref: '#/components/schemas/PwLogin'}
        - {$ref: '#/components/schemas/MailLogin'}
      discriminator:
        propertyName: kind
        mapping:
          pw: '#/components/schemas/PwLogin'
          mail: '#/components/schemas/MailLogin'
    # A cycle through two raw unions, no secret in it.
    Node:
      oneOf:
        - type: object
          properties:
            child: {$ref: '#/components/schemas/Node'}
        - type: object
          properties:
            other: {$ref: '#/components/schemas/Node'}
    # A cycle through two raw unions, with a secret behind it.
    Ring:
      oneOf:
        - type: object
          properties:
            next: {$ref: '#/components/schemas/Ring'}
        - type: object
          properties:
            password: {type: string, format: password}
