openapi: 3.1.0
info: {title: Secrets, version: "1"}
paths:
  /login:
    post:
      operationId: login
      requestBody:
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Login'}
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Extra'}
components:
  schemas:
    Pass: {type: string, format: password}
    Cred:
      oneOf:
        - {type: string, format: password}
        - {type: integer}
    Login:
      type: object
      properties:
        name: {type: string}
        plain: {type: string, format: password}
        written: {type: string, writeOnly: true}
        anyOfNull:
          anyOf:
            - {type: string, format: password}
            - {type: 'null'}
        oneOfNull:
          oneOf:
            - {type: string, writeOnly: true}
            - {type: 'null'}
        refTarget: {$ref: '#/components/schemas/Pass'}
        refNullable:
          anyOf:
            - {$ref: '#/components/schemas/Pass'}
            - {type: 'null'}
        annotated:
          allOf:
            - {$ref: '#/components/schemas/Pass'}
            - {description: an annotation}
        tokens:
          type: array
          items: {type: string, format: password}
        tokenRefs:
          type: array
          items: {$ref: '#/components/schemas/Pass'}
        byName:
          type: object
          additionalProperties: {type: string, format: password}
        cred: {$ref: '#/components/schemas/Cred'}
        creds:
          type: array
          items: {$ref: '#/components/schemas/Cred'}
    Extra:
      type: object
      properties:
        name: {type: string}
      additionalProperties: {type: string, format: password}
