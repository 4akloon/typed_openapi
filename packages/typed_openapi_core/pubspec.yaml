name: typed_openapi_core
description: >
  The engine of typed_openapi: reads OpenAPI 3.x specs, normalizes their
  defects with named rules, checks them with stable diagnostic codes and
  builds the semantic IR that the Dart client generator writes from.
version: 0.2.0
homepage: https://github.com/4akloon/typed_openapi
repository: https://github.com/4akloon/typed_openapi
issue_tracker: https://github.com/4akloon/typed_openapi/issues
topics:
  - openapi
  - swagger
  - parser
  - linter
  - diagnostics

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  # collection and string_scanner are used by the YAML scanner copied from
  # package:yaml into lib/src/load/yaml.
  collection: ^1.15.0
  crypto: ^3.0.6
  path: ^1.9.1
  source_span: ^1.10.2
  string_scanner: ^1.2.0

dev_dependencies:
  test: ^1.24.0
  # A test checks that the engine reads path templates as the client core
  # does.
  typed_openapi_client: ^0.2.0
  # The fixture specs and helpers the tests share (not published).
  typed_openapi_test_support: any
  # Tests compare the composer with package:yaml's loader.
  yaml: ^3.1.4

resolution: workspace
