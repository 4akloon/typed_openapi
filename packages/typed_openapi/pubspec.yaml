name: typed_openapi
description: >
  OpenAPI 3.x to Dart client generator for imperfect, code-first specs:
  named normalizer rules, diagnostics with stable codes, overrides,
  open enums, unions with an unknown variant and typed errors.
version: 0.0.1
homepage: https://github.com/4akLoon/typed_openapi
repository: https://github.com/4akLoon/typed_openapi

executables:
  typed_openapi:

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  args: ^2.7.0
  # collection and string_scanner are used by the YAML scanner copied from
  # package:yaml into lib/src/load/yaml.
  collection: ^1.15.0
  crypto: ^3.0.6
  io: ^1.1.0
  meta: ^1.15.0
  path: ^1.9.1
  source_span: ^1.10.2
  string_scanner: ^1.2.0

dev_dependencies:
  test: ^1.24.0
  # A test checks that the generator reads path templates as the runtime
  # does.
  typed_openapi_client: ^0.0.1
  # The fixture specs and helpers the tests share (not published).
  typed_openapi_test_support: any
  # Tests compare the composer with package:yaml's loader.
  yaml: ^3.1.4

resolution: workspace
