name: typed_openapi
description: >
  OpenAPI 3.x to Dart client generator for imperfect, code-first specs:
  named normalizer rules, diagnostics with stable codes, overrides,
  open enums, unions with an unknown variant and typed errors.
version: 0.0.1
homepage: https://github.com/4akLoon/typed_openapi
repository: https://github.com/4akLoon/typed_openapi

executables:
  typed_openapi:

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  args: ^2.7.0
  io: ^1.1.0
  path: ^1.9.1
  source_span: ^1.10.2
  # Pinned to one minor version: YamlEventGuard reads package:yaml's own parser
  # events (package:yaml/src/parser.dart), which are not public API.
  yaml: ">=3.1.4 <3.2.0"

dev_dependencies:
  test: ^1.24.0

resolution: workspace
